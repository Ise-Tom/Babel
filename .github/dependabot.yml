version: 2
updates:
  - package-ecosystem: docker
    directory: /experiments/postgres_store
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 removed the compiler API used by the security lint.
      # Migrate and qualify that policy before taking a major compiler update.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
