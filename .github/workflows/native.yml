name: Native protocol qualification labs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  core:
    name: Native build, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked independent LDAP test client
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-ci.in
      - name: Install independent BIND DNS clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bind9-dnsutils
      - name: Activate pinned native toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview,rust-docs
      - name: Native formatting and static checks
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Unit, negative, property and transport tests
        run: |
          cargo test --workspace --all-targets --locked
          cargo test -p babel-directory -p babel-dns -p babel-ldap -p babel-ldap-directory --all-targets --release --locked
      - name: Release build and independent DNS and LDAP clients
        run: |
          cargo build --workspace --release --locked
          python native/babel-ldap/tests/smoke_ldap.py target/release/babel-ldap
          mkdir -p reports
          python native/babel-ldap-directory/tests/probe_reads.py target/release/babel-ldap-directory \
            --revision "$GITHUB_SHA" --output reports/p01-04-ldap-directory.json
          python native/babel-dns/tests/probe_dns.py target/release/babel-dns \
            --revision "$GITHUB_SHA" --output reports/p01-13-dns-discovery.json
          BABEL_TLS_REPORT=reports/tls-independent-interop.json \
            python native/babel-tls-lab/tests/interop_tls.py target/release/babel-tls-lab
      - name: Bind actual compiler, Linux host and hardened parser binary
        run: |
          mkdir -p reports
          rustc -vV > reports/parser-rustc.txt
          readelf --version > reports/parser-binutils.txt
          LC_ALL=C readelf -h -l -d --wide target/release/babel-ldap > reports/parser-elf.txt
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > "$RUNNER_TEMP/babel-parser-metadata.json"
          python scripts/qualify_parser_baseline.py --metadata "$RUNNER_TEMP/babel-parser-metadata.json" \
            --compiler reports/parser-rustc.txt --inspector reports/parser-binutils.txt \
            --elf reports/parser-elf.txt --binary target/release/babel-ldap \
            --revision "$GITHUB_SHA" --runner-image "${ImageVersion:-local}" > reports/parser-baseline.json
      - name: Check the P00-09 open-loop workload and report against release LDAP
        run: |
          python scripts/run_workload.py --binary target/release/babel-ldap \
            --source-revision "$GITHUB_SHA" --seed babel-ldap-smoke-v1 \
            --run-id "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --host-label "GitHub Actions ubuntu-24.04 ${ImageVersion:-unknown}" \
            --output reports/p00-09-workload-smoke.json
      - name: Install pinned coverage tool
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked --root "$RUNNER_TEMP/babel-native-tools"
          echo "$RUNNER_TEMP/babel-native-tools/bin" >> "$GITHUB_PATH"
      - name: Instrumented core and process coverage (minimum 90 percent lines)
        run: |
          cargo llvm-cov --workspace --all-targets --no-report
          LLVM_PROFILE_FILE="$PWD/target/llvm-cov-target/babel-smoke-%p-%m.profraw" \
            python native/babel-ldap/tests/smoke_ldap.py target/llvm-cov-target/debug/babel-ldap
          mkdir -p reports
          BABEL_TLS_REPORT=reports/tls-coverage-interop.json \
            LLVM_PROFILE_FILE="$PWD/target/llvm-cov-target/tls-smoke-%p-%m.profraw" \
            python native/babel-tls-lab/tests/interop_tls.py target/llvm-cov-target/debug/babel-tls-lab
          LLVM_PROFILE_FILE="$PWD/target/llvm-cov-target/dns-smoke-%p-%m.profraw" \
            python native/babel-dns/tests/probe_dns.py target/llvm-cov-target/debug/babel-dns \
              --revision "$GITHUB_SHA" --output reports/dns-instrumented-probe.json
          LLVM_PROFILE_FILE="$PWD/target/llvm-cov-target/ldap-directory-%p-%m.profraw" \
            python native/babel-ldap-directory/tests/probe_reads.py target/llvm-cov-target/debug/babel-ldap-directory \
              --revision "$GITHUB_SHA" --output reports/ldap-directory-instrumented.json
          cargo llvm-cov report --package babel-ldap-directory --ignore-filename-regex '/tests/|/main.rs$' \
            --fail-under-lines 90 --lcov --output-path reports/ldap-directory-coverage.lcov
          cargo llvm-cov report --package babel-dns --ignore-filename-regex '/tests/|/main.rs$' \
            --fail-under-lines 90 --lcov --output-path reports/dns-discovery-coverage.lcov
          cargo llvm-cov report --package babel-directory --ignore-filename-regex '/tests/' \
            --fail-under-lines 90 --lcov --output-path reports/directory-core-coverage.lcov
          cargo llvm-cov report --package babel-tls-lab --ignore-filename-regex '/tests/|/budget_tests.rs$|/main.rs$' \
            --fail-under-lines 90 --lcov --output-path reports/tls-lab-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex '/tests/|/budget_tests.rs$|/main.rs$|/babel-store-driver-lab/' --fail-under-lines 90 \
            --lcov --output-path reports/native-coverage.lcov
      - name: Internal lab archive with actual dependency notices (not a release)
        run: |
          mkdir -p reports "$RUNNER_TEMP/babel-protocol-labs"
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > "$RUNNER_TEMP/babel-cargo-metadata.json"
          babel_lab_sysroot=$(rustc --print sysroot)
          python3 scripts/collect_native_notices.py --metadata "$RUNNER_TEMP/babel-cargo-metadata.json" \
            --rust-docs "$babel_lab_sysroot/share/doc/rust" --packages babel-ldap babel-tls-lab babel-dns babel-ldap-directory \
            --output "$RUNNER_TEMP/babel-protocol-labs/notices"
          babel_notice_manifest_sha=$(sha256sum "$RUNNER_TEMP/babel-protocol-labs/notices/manifest.json" | cut -d ' ' -f1)
          cp target/release/babel-ldap target/release/babel-tls-lab target/release/babel-dns \
            target/release/babel-ldap-directory "$RUNNER_TEMP/babel-protocol-labs/"
          tar -cf reports/babel-protocol-labs-linux-x86_64.tar -C "$RUNNER_TEMP/babel-protocol-labs" .
          (cd reports && sha256sum babel-protocol-labs-linux-x86_64.tar > native-SHA256SUMS && sha256sum -c native-SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/babel-native-extracted"
          tar -xf reports/babel-protocol-labs-linux-x86_64.tar -C "$RUNNER_TEMP/babel-native-extracted"
          python3 scripts/collect_native_notices.py --verify --output "$RUNNER_TEMP/babel-native-extracted/notices" \
            --expected-sha256 "$babel_notice_manifest_sha"
          python native/babel-ldap/tests/smoke_ldap.py "$RUNNER_TEMP/babel-native-extracted/babel-ldap"
          python native/babel-ldap-directory/tests/probe_reads.py "$RUNNER_TEMP/babel-native-extracted/babel-ldap-directory" \
            --revision "$GITHUB_SHA" --output reports/ldap-directory-packaged-probe.json
          python native/babel-dns/tests/probe_dns.py "$RUNNER_TEMP/babel-native-extracted/babel-dns" \
            --revision "$GITHUB_SHA" --output reports/dns-packaged-probe.json
          BABEL_TLS_REPORT=reports/tls-packaged-interop.json \
            python native/babel-tls-lab/tests/interop_tls.py "$RUNNER_TEMP/babel-native-extracted/babel-tls-lab"
      - name: Preserve native evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lab-evidence
          path: reports/
          retention-days: 14

  store-driver:
    name: Rust PostgreSQL driver qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked tooling and pinned coverage compiler
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt -r requirements-ci.in
          rustup toolchain install 1.100.0 --profile minimal --component llvm-tools-preview,rust-docs
          cargo install cargo-llvm-cov --version 0.9.1 --locked --root "$RUNNER_TEMP/babel-native-tools"
          echo "$RUNNER_TEMP/babel-native-tools/bin" >> "$GITHUB_PATH"
      - name: Real SCRAM, binding, transaction, deadline and cancellation cases
        run: |
          mkdir -p reports
          python -m scripts.qualify_store_driver --coverage
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > "$RUNNER_TEMP/babel-driver-metadata.json"
          babel_driver_sysroot=$(rustc --print sysroot)
          python scripts/collect_native_notices.py --metadata "$RUNNER_TEMP/babel-driver-metadata.json" \
            --rust-docs "$babel_driver_sysroot/share/doc/rust" --packages babel-store-driver-lab \
            --output reports/store-driver-notices
          python scripts/collect_native_notices.py --verify --output reports/store-driver-notices
      - name: Preserve driver qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-driver-qualification
          path: |
            reports/store-driver-qualification.json
            reports/store-driver-coverage.lcov
            reports/store-driver-notices/
          retention-days: 14

  kerberos:
    name: MIT Kerberos/PAC disposable qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install source build prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y bison
      - name: Verify signed source and run synthetic loopback KDC cases
        run: bash lab/kerberos/run.sh reports/kerberos-qualification.json
      - name: Preserve Kerberos qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kerberos-qualification
          path: reports/kerberos-qualification.json
          retention-days: 14

  supply-chain:
    name: Native dependency and license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Activate pinned toolchain and fetch locked graphs
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Install pinned audit and verified SBOM tools
        run: |
          cargo install cargo-deny --version 0.21.0 --locked --root "$RUNNER_TEMP/babel-native-tools"
          echo "$RUNNER_TEMP/babel-native-tools/bin" >> "$GITHUB_PATH"
          python3 scripts/install_ci_tools.py --directory "$RUNNER_TEMP/babel-ci-tools" --tools syft
      - name: Audit advisories, licenses, bans and sources including development graphs
        run: |
          mkdir -p reports
          cargo deny --locked --all-features --format json check 2>&1 | tee reports/native-audit.jsonl
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked --all-features \
            --format json check 2>&1 | tee reports/fuzz-audit.jsonl
      - name: Native Cargo.lock CycloneDX dependency inventory
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          "$RUNNER_TEMP/babel-ci-tools/syft" scan dir:. \
            --source-name Babel-native-development --override-default-catalogers rust-cargo-lock-cataloger \
            --exclude '**/target/**' --exclude '**/.git/**' --exclude '**/reports/**' \
            -o cyclonedx-json=reports/native-dependencies.cdx.json
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - name: Preserve dependency/security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-supply-chain
          path: reports/
          retention-days: 14

  fuzz:
    name: Native sanitizer fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchains and fuzz driver
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup toolchain install nightly-2026-11-17 --profile minimal
          cargo +1.100.0 install cargo-fuzz --version 0.13.2 --locked --root "$RUNNER_TEMP/babel-native-tools"
          echo "$RUNNER_TEMP/babel-native-tools/bin" >> "$GITHUB_PATH"
          cargo +nightly-2026-11-17 fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Bounded address-sanitizer fuzz of decoder, responder and framing
        env:
          EVENT_NAME: ${{ github.event_name }}
          CARGO_NET_OFFLINE: 'true'
        run: |
          mkdir -p reports
          babel_fuzz_seconds=20
          babel_fuzz_runs=20000
          if [ "$EVENT_NAME" = schedule ]; then
            babel_fuzz_seconds=120
            babel_fuzz_runs=200000
          fi
          cargo +nightly-2026-11-17 fuzz run ldap_frame -- \
            -runs="$babel_fuzz_runs" -max_total_time="$babel_fuzz_seconds" \
            -max_len=16384 -rss_limit_mb=512 -seed=1 2>&1 | tee reports/native-fuzz.log
          cargo +nightly-2026-11-17 fuzz run tls_record -- \
            -runs="$babel_fuzz_runs" -max_total_time="$babel_fuzz_seconds" \
            -max_len=16384 -rss_limit_mb=512 -seed=1 2>&1 | tee reports/tls-fuzz.log
          cargo +nightly-2026-11-17 fuzz run dns_datagram -- \
            -runs="$babel_fuzz_runs" -max_total_time="$babel_fuzz_seconds" \
            -max_len=513 -rss_limit_mb=512 -seed=1 2>&1 | tee reports/dns-fuzz.log
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - name: Preserve fuzz logs and crash reproductions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fuzz-evidence
          path: |
            reports/native-fuzz.log
            reports/tls-fuzz.log
            reports/dns-fuzz.log
            fuzz/artifacts/
          retention-days: 14

  gate:
    name: Native gate
    if: ${{ always() }}
    needs: [core, store-driver, kerberos, supply-chain, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              sys.exit('Native gates did not succeed: ' + ', '.join(failures))
          print('All native checks succeeded')
          PYTHON
