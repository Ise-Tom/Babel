name: Update private dashboard

on:
  # Only successful push/manual CI on this repository's main reaches the write job.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: private-dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Update permanent GitHub dashboard
    if: >-
      github.repository == 'Ise-Tom/Babel' &&
      github.event.workflow_run.head_repository.full_name == 'Ise-Tom/Babel' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Publish reviewed facts using GitHub's existing access controls
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/publish_dashboard.py --revision "$SOURCE_REVISION"
