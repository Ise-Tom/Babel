name: Update private dashboard

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Update permanent GitHub dashboard
    if: >-
      github.repository == 'Ise-Tom/Babel' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Publish reviewed facts using GitHub's existing access controls
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/publish_dashboard.py --revision "$SOURCE_REVISION"
