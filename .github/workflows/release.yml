name: Source prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # Caller-commit workflow; retain ./ syntax supported by actionlint v1.7.12.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  release-environment:
    name: Verify solo source-release environment and tag restrictions
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail before an unprotected environment can be automatically created
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_environment.py --mode solo

  release:
    name: Draft source prerelease
    needs: [checks, release-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: source-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce source-only release policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_release.py "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -f LICENSE
      - name: Package exact tested source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package_source.py --tag "$RELEASE_TAG" --output dist
          cd dist
          sha256sum -c SHA256SUMS
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --prerelease --title "Babel $RELEASE_TAG (source only)" \
            --notes-file docs/prerelease-notes.md
