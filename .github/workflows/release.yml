name: Source prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Draft source prerelease
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: source-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce source-only release policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_release.py "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -f LICENSE
      - name: Package exact tested source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="Babel-$RELEASE_TAG/" HEAD | gzip -n > "dist/Babel-$RELEASE_TAG.tar.gz"
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS             --verify-tag --draft --prerelease --title "Babel $RELEASE_TAG (source only)"             --notes-file docs/prerelease-notes.md
