name: Project dashboard

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: dashboard

jobs:
  verify:
    name: Dashboard build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install integrity-locked tooling without install scripts
        run: npm ci --ignore-scripts
      - name: Types, code/DOM security lint and standalone build
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run test:build
          python3 - <<'PYTHON'
          import hashlib, io, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, '../scripts')
          from verify_pages_artifact import verified_page
          page = Path('dist/index.html').read_bytes()
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('index.html', page)
          raw = buffer.getvalue()
          digest = 'sha256:' + hashlib.sha256(raw).hexdigest()
          assert verified_page(raw, digest) == page
          print('Built dashboard passes the deployment artifact policy')
          PYTHON
      - name: Audit full tooling graph and create dependency inventory
        run: |
          mkdir -p ../reports
          npm audit --audit-level=low --json > ../reports/dashboard-npm-audit.json
          npm sbom --sbom-format cyclonedx > ../reports/dashboard-dependencies.cdx.json
      - name: Install pinned test browser through Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop/mobile flows, offline use, injection and accessibility
        run: npm run test:e2e
      - name: Render permanent GitHub report for review
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 ../scripts/render_dashboard.py --revision "$SOURCE_REVISION"
      - name: Preserve standalone HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-standalone
          path: dashboard/dist/index.html
          retention-days: 14
          if-no-files-found: error
      - name: Preserve browser/security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-validation
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
            reports/dashboard-*.png
            reports/dashboard-*.json
            reports/dashboard.md
          retention-days: 14
