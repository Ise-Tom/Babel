name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Documentation links and checker tests
        run: |
          python3 scripts/check_docs.py
          python3 -m unittest discover -s tests -v
      - name: Install verified CI tools
        run: python3 scripts/install_ci_tools.py --directory "$RUNNER_TEMP/babel-ci-tools"
      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/babel-ci-tools/actionlint"'

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified CI tools
        run: python3 scripts/install_ci_tools.py --directory "$RUNNER_TEMP/babel-ci-tools"
      - name: Scan Git history
        run: '"$RUNNER_TEMP/babel-ci-tools/gitleaks" git --redact --no-banner .'
