name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a descriptive development branch
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.user.login != 'dependabot[bot]' ||
           !startsWith(github.head_ref, 'dependabot/'))
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_BRANCH" =~ ^dev/[a-z0-9]+(-[a-z0-9]+){2,}$ ]]; then
            echo '::error::Use dev/<scope>-<descriptive-task> with at least three hyphen-separated lowercase words, for example dev/phase0-protocol-operation-matrix. See AGENTS.md.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked tooling and verify direct pins
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-ci.in
      - name: Reject components without CI gates
        run: python scripts/check_ci_scope.py
      - name: Parse privileged Hyper-V helper without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/reference_lab_hyperv.ps1),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Design traceability and documentation links
        run: |
          python scripts/check_design.py
          python scripts/check_lab_definition.py
          python scripts/build_dashboard.py --check
          python scripts/check_docs.py
      - name: Validate the protocol matrix and Phase 0 design contracts
        run: |
          mkdir -p reports
          python scripts/check_conformance.py --revision "$GITHUB_SHA" > reports/protocol-operation-matrix.json
          python scripts/check_phase0_contract.py --revision "$GITHUB_SHA" > reports/phase0-contract.json
          python scripts/check_state_security.py --revision "$GITHUB_SHA" > reports/state-security-contract.json
          python scripts/check_security_intake.py --output reports/security-intake-offline.json
      - name: Inspect the exact prerelease source archive and its asset rights
        run: |
          python scripts/package_source.py --tag v0.0.0-alpha.0 \
            --output "$RUNNER_TEMP/babel-source" --audit-report reports/source-rights-audit.json
          cd "$RUNNER_TEMP/babel-source"
          sha256sum -c SHA256SUMS
      - name: Preserve Phase 0 design-contract evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-contract-evidence
          path: |
            reports/protocol-operation-matrix.json
            reports/phase0-contract.json
            reports/state-security-contract.json
            reports/source-rights-audit.json
            reports/security-intake-offline.json
          retention-days: 14
      - name: Formatting, lint and strict types
        run: |
          ruff format --check scripts tests experiments/postgres_store native/babel-dns/tests/probe_dns.py native/babel-ldap/tests/smoke_ldap.py native/babel-tls-lab/tests/interop_tls.py
          ruff check scripts tests experiments/postgres_store native/babel-dns/tests/probe_dns.py native/babel-ldap/tests/smoke_ldap.py native/babel-tls-lab/tests/interop_tls.py
          mypy
      - name: Generate and independently audit the full synthetic workload fixture
        run: |
          mkdir -p reports
          python scripts/generate_workload.py --profile full --seed babel-phase0-v1 \
            --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/babel-synthetic-workload"
          python scripts/check_workload.py --dataset "$RUNNER_TEMP/babel-synthetic-workload" \
            | tee reports/workload-verification.json
          cp "$RUNNER_TEMP/babel-synthetic-workload/manifest.json" reports/workload-manifest.json
      - name: Preserve synthetic workload manifest and audit summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-workload-evidence
          path: |
            reports/workload-manifest.json
            reports/workload-verification.json
          retention-days: 14

  tests:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked tooling
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-ci.in
      - name: Tests and minimum 90 percent branch-inclusive coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage xml -o reports/coverage.xml
          coverage report
      - name: Preserve coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: reports/coverage.xml
          retention-days: 14

  security:
    name: Static security and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-ci.in
      - name: Python static security analysis
        run: |
          mkdir -p reports
          bandit -c pyproject.toml -r scripts experiments/postgres_store/experiment.py native/babel-dns/tests/probe_dns.py native/babel-tls-lab/tests/interop_tls.py -f json -o reports/bandit.json
      - name: Workflow security analysis
        if: ${{ !cancelled() }}
        run: zizmor --offline --strict-collection --format json .github/workflows > reports/zizmor.json
      - name: Audit locked dependencies and generate CycloneDX SBOM
        if: ${{ !cancelled() }}
        run: >-
          pip-audit --strict --disable-pip --require-hashes
          -r requirements-ci.txt --progress-spinner off
          --format cyclonedx-json --output reports/ci-dependencies.cdx.json
      - name: Preserve security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: reports/
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified CI binaries
        run: python3 scripts/install_ci_tools.py --directory "$RUNNER_TEMP/babel-ci-tools" --tools actionlint
      - name: Validate Actions syntax and shell snippets
        run: '"$RUNNER_TEMP/babel-ci-tools/actionlint"'

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified CI binaries
        run: python3 scripts/install_ci_tools.py --directory "$RUNNER_TEMP/babel-ci-tools" --tools gitleaks
      - name: Scan full Git history and checked-out files
        run: |
          "$RUNNER_TEMP/babel-ci-tools/gitleaks" git --redact --no-banner .
          "$RUNNER_TEMP/babel-ci-tools/gitleaks" dir --redact --no-banner .

  native:
    # Caller-commit workflow; ./ is supported by the pinned actionlint.
    uses: ./.github/workflows/native.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  dashboard:
    # Caller-commit workflow; ./ is supported by the pinned actionlint.
    uses: ./.github/workflows/dashboard.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  postgres-store:
    name: PostgreSQL synthetic state experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install integrity-locked test tools
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-ci.in
      - name: Real transactions, lock ordering and process crash recovery
        run: |
          coverage run --source=experiments.postgres_store.experiment -m unittest discover -s experiments/postgres_store -v
          coverage report --fail-under=90
          coverage xml -o reports/postgres-store-coverage.xml
      - name: Inventory the pinned test-image dependencies
        run: |
          python3 scripts/install_ci_tools.py --directory "$RUNNER_TEMP/babel-ci-tools" --tools syft
          python3 - <<'PYTHON' > "$RUNNER_TEMP/postgres-image"
          from experiments.postgres_store.experiment import IMAGE
          print(IMAGE)
          PYTHON
          read -r POSTGRES_IMAGE < "$RUNNER_TEMP/postgres-image"
          "$RUNNER_TEMP/babel-ci-tools/syft" "docker:$POSTGRES_IMAGE" -o cyclonedx-json=reports/postgres-test-image.cdx.json
      - name: Preserve experiment evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-store-evidence
          path: |
            reports/postgres-store-coverage.xml
            reports/postgres-test-image.cdx.json
          retention-days: 14

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [repository, tests, security, workflows, secrets, native, dashboard, postgres-store]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed (failed, skipped or cancelled jobs block)
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              sys.exit('Required CI jobs did not succeed: ' + ', '.join(failures))
          print('All required CI jobs succeeded')
          PYTHON
