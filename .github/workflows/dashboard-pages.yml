name: Publish interactive dashboard

on:
  # The job guard additionally excludes PR/fork/tag/scheduled CI and failed runs.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-dashboard-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify current main CI and dashboard artifact
    if: >-
      github.repository == 'Ise-Tom/Babel' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == 'Ise-Tom/Babel' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require successful CI on this exact current main revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python scripts/check_pages_source.py --revision "$SOURCE_REVISION"
          --run-id "$CI_RUN_ID" --output "$GITHUB_OUTPUT"

      - name: Download the immutable archive and verify digest, boundaries and page policy
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          gh api --method GET "repos/Ise-Tom/Babel/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/dashboard.zip"
          python scripts/verify_pages_artifact.py --archive "$RUNNER_TEMP/dashboard.zip" \
            --digest "$ARTIFACT_DIGEST" --output "$RUNNER_TEMP/verified-site"
      - name: Package only verified static content
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/verified-site

  deploy:
    name: Publish verified HTML to public GitHub Pages
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions-only publishing and HTTPS on the existing site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Ise-Tom/Babel/pages \
            --jq '.build_type == "workflow" and .https_enforced == true' > "$RUNNER_TEMP/pages-policy"
          read -r VERIFIED < "$RUNNER_TEMP/pages-policy"
          if test "$VERIFIED" != true; then
            echo '::error::Pages requires Source: GitHub Actions and Enforce HTTPS in repository Settings > Pages.'
            exit 1
          fi
      - name: Read existing site configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Refuse a stale deployment if main changed after verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.verify.outputs.revision }}
        run: |
          gh api repos/Ise-Tom/Babel/branches/main --jq '.commit.sha' > "$RUNNER_TEMP/main.sha"
          read -r CURRENT_REVISION < "$RUNNER_TEMP/main.sha"
          test "$CURRENT_REVISION" = "$SOURCE_REVISION"
      - name: Publish public dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
