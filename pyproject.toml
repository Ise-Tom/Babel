# Python tooling configuration; native protocol labs use Rust.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "native/babel-dns/tests/probe_dns.py", "native/babel-ldap/tests/smoke_ldap.py", "native/babel-ldap-directory/tests/probe_reads.py", "native/babel-tls-lab/tests/interop_tls.py", "experiments/postgres_store/experiment.py"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == ["\x27]__main__["\x27]:']

[tool.bandit]
exclude_dirs = ["tests"]
