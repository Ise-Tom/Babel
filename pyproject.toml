# Configuration for repository tooling; no application language has been selected.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == ["\x27]__main__["\x27]:']

[tool.bandit]
exclude_dirs = ["tests"]
