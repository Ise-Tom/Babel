[advisories]
yanked = "deny"

[licenses]
include-dev = true
include-build = true
allow = ["MIT", "Apache-2.0", "NCSA"]
# NCSA covers the libFuzzer development harness; retain upstream notices.
# Babel is Apache-2.0; audit unpublished workspace packages as well.
private = { ignore = false }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
