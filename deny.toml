[advisories]
yanked = "deny"

[licenses]
include-dev = true
include-build = true
allow = ["MIT", "Apache-2.0", "NCSA", "ISC", "BSD-3-Clause", "Unicode-3.0"]
# Unicode-3.0 covers reviewed identifier/normalization/property tables: retain
# copyright/permission/disclaimer and do not use holder names for promotion.
# ISC is required by reviewed ring/webpki/untrusted TLS-lab dependencies.
# BSD-3-Clause covers subtle; retain notice/disclaimer and non-endorsement terms.
# Retain their actual copyright/permission notices; this does not clear protocol/image rights.
# NCSA covers the libFuzzer development harness; retain upstream notices.
# Babel is Apache-2.0; audit unpublished workspace packages as well.
private = { ignore = false }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
