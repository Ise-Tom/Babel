[workspace]
members = [
    "native/babel-directory",
    "native/babel-ldap",
    "native/babel-tls-lab",
    "native/babel-store-driver-lab",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

# Keep integer overflow visible in optimized qualification binaries.
[profile.release]
overflow-checks = true
