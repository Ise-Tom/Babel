<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Babel — Delivery dashboard</title>
<style>__CSS__</style>
</head>
<body>
<noscript><p>This offline dashboard needs JavaScript enabled to explore phase and implementation records.</p></noscript>
<a class="skip" href="#content">Skip to content</a>
<div class="app">
  <header class="sidebar" aria-label="Project navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><div>BABEL<small>DELIVERY WORKSPACE</small></div></div>
    <nav aria-label="Dashboard views"><button id="overview-tab" class="nav-tab">▦ <span>Phase board</span></button><button id="capabilities-tab" class="nav-tab">◇ <span>Capabilities</span></button><button id="log-tab" class="nav-tab">≡ <span>Implementation & issues</span></button></nav>
  </header>
  <div class="workspace">
    <div class="topbar"><span id="snapshot-short" class="crumb"></span><button id="download" class="button secondary">Export JSON</button></div>
    <section class="toolbar" aria-label="Dashboard filters">
      <div class="phase-picker"><label for="mobile-phase">Jump to a phase</label><select id="mobile-phase"></select></div>
      <div class="search-field"><label for="search">Search phases, requirements, features or implementation notes</label><input id="search" type="search" placeholder="Try “Kerberos”, “P01-04” or “RootDSE”…" autocomplete="off"></div>
      <div id="status-field"><label for="status">Requirement status</label><select id="status"><option value="all">All requirements</option><option value="planned">Planned</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="accepted">Accepted</option></select></div>
      <div id="capability-status-field" hidden><label for="capability-status">Implementation status</label><select id="capability-status"><option value="all">All capabilities</option><option value="planned">Planned</option><option value="prototype">Prototype</option><option value="partial">Partial implementation</option><option value="implemented">Implemented (unqualified)</option></select></div>
    </section>
    <main id="content" tabindex="-1"></main>
    <footer id="footer"></footer>
  </div>
</div>
<dialog id="feature-dialog" aria-labelledby="feature-title"><div id="feature-content"></div><button id="close-dialog" class="button secondary">Close feature</button></dialog>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<script id="dashboard-data" type="application/json">__DATA__</script>
<script>__JS__</script>
</body>
</html>
